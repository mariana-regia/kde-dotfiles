#
# $XDG_CONFIG_HOME/psd/psd.conf
#
# Keep profile-sync-daemon from moving Firefox profiles to /run/user/*/psd.
# Firefox's profile groups and multiple nested profiles do not tolerate broken
# PSD symlinks well after crashes, reboots, or failed unsync operations.
#
# An uncommented, empty BROWSERS array means PSD manages no browsers. If PSD is
# needed for another browser later, add only that browser here, for example:
# BROWSERS=(google-chrome)
BROWSERS=()
